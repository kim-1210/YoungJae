<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
  <rect width="1400" height="460" fill="#ffffff"/>
  <style>
    .title { font: 700 30px sans-serif; fill: #111827; }
    .box-title { font: 700 24px sans-serif; fill: #111827; }
    .box-desc { font: 500 18px sans-serif; fill: #374151; }
    .small { font: 500 15px sans-serif; fill: #6b7280; }
    .arrow { stroke: #111827; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
    .grid { stroke: #d1d5db; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111827"/>
    </marker>
  </defs>

  <text x="70" y="54" class="title">MNIST 모델은 손글씨 그림을 보고 숫자 정답을 고르는 기계입니다</text>

  <rect x="60" y="120" width="190" height="190" rx="12" fill="#eef6ff" stroke="#333333" stroke-width="3"/>
  <g transform="translate(92 152)">
    <rect x="0" y="0" width="126" height="126" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <path d="M98 15 C70 5, 35 15, 30 45 C28 65, 60 62, 74 72 C92 86, 82 111, 45 114" fill="none" stroke="#111111" stroke-width="17" stroke-linecap="round"/>
    <line x1="31.5" y1="0" x2="31.5" y2="126" class="grid"/>
    <line x1="63" y1="0" x2="63" y2="126" class="grid"/>
    <line x1="94.5" y1="0" x2="94.5" y2="126" class="grid"/>
    <line x1="0" y1="31.5" x2="126" y2="31.5" class="grid"/>
    <line x1="0" y1="63" x2="126" y2="63" class="grid"/>
    <line x1="0" y1="94.5" x2="126" y2="94.5" class="grid"/>
  </g>
  <text x="155" y="348" text-anchor="middle" class="box-title">손글씨 그림</text>
  <text x="155" y="378" text-anchor="middle" class="box-desc">28 x 28칸</text>

  <path d="M270 215 H345" class="arrow"/>

  <rect x="365" y="120" width="210" height="190" rx="12" fill="#fff7e6" stroke="#333333" stroke-width="3"/>
  <text x="470" y="178" text-anchor="middle" class="box-title">한 줄로 펼치기</text>
  <text x="470" y="218" text-anchor="middle" class="box-desc">그림 칸들을</text>
  <text x="470" y="248" text-anchor="middle" class="box-desc">784개 숫자로 바꿈</text>
  <text x="470" y="285" text-anchor="middle" class="small">코드: x.view(-1, 28*28)</text>

  <path d="M595 215 H670" class="arrow"/>

  <rect x="690" y="100" width="210" height="230" rx="12" fill="#edf9f0" stroke="#333333" stroke-width="3"/>
  <text x="795" y="162" text-anchor="middle" class="box-title">단서 찾기 1</text>
  <text x="795" y="204" text-anchor="middle" class="box-desc">선, 꺾임, 둥근 모양</text>
  <text x="795" y="234" text-anchor="middle" class="box-desc">같은 특징을 봄</text>
  <text x="795" y="285" text-anchor="middle" class="small">코드 이름: fc1</text>

  <path d="M920 215 H995" class="arrow"/>

  <rect x="1015" y="100" width="210" height="230" rx="12" fill="#edf9f0" stroke="#333333" stroke-width="3"/>
  <text x="1120" y="162" text-anchor="middle" class="box-title">단서 정리하기</text>
  <text x="1120" y="204" text-anchor="middle" class="box-desc">앞에서 찾은 단서를</text>
  <text x="1120" y="234" text-anchor="middle" class="box-desc">한 번 더 정리함</text>
  <text x="1120" y="285" text-anchor="middle" class="small">코드 이름: fc2</text>

  <path d="M1245 215 H1295" class="arrow"/>

  <rect x="1315" y="120" width="50" height="190" rx="12" fill="#fbeff5" stroke="#333333" stroke-width="3"/>
  <text x="1340" y="350" text-anchor="middle" class="box-title">답</text>
  <text x="1340" y="380" text-anchor="middle" class="box-desc">0~9</text>

  <text x="700" y="430" text-anchor="middle" class="box-desc">정리하면, 모델은 그림을 숫자 줄로 바꾸고 단서를 찾아서 가장 가능성이 높은 숫자를 고릅니다.</text>
</svg>
